crosswalk_id: verifiable-ai-governance-crosswalk
version: "2.1.0"
frameworks_covered:
  - nist_ai_rmf
  - nist_ai_600_1
  - owasp_llm_top10
  - owasp_agentic_top10
  - mitre_atlas
frameworks_pending:
  - iso_iec_42001
disclaimer: >
  Referência de apoio construída a partir da leitura direta dos textos-fonte oficiais:
  NIST AI 100-1 (AI RMF 1.0, jan/2023, nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf),
  NIST AI 600-1 (Generative AI Profile, jul/2024, doi.org/10.6028/NIST.AI.600-1), OWASP
  Top 10 for LLM Applications & Generative AI 2025 (nov/2024, genai.owasp.org), OWASP
  Top 10 for Agentic Applications 2026 (dez/2025, genai.owasp.org) e MITRE ATLAS, cujas
  táticas e técnicas foram conferidas contra o relatório MITRE SAFE-AI (abr/2025,
  atlas.mitre.org) e as referências cruzadas que o próprio OWASP Top 10 faz para IDs de
  técnica do ATLAS. Não constitui parecer jurídico, certificação ou declaração de
  conformidade, e deve ser revisada por jurídico/compliance antes de qualquer uso
  formal. Citações do NIST AI RMF usam função/categoria nomeada (ex.: "GOVERN 2") como
  granularidade padrão em todo o crosswalk; subcategoria numerada (ex.: "GOVERN 1.6")
  só é citada nos poucos casos em que ela corresponde de forma direta e inequívoca ao
  controle - uma escolha editorial deliberada de manter a maioria das citações no nível
  mais estável, não uma limitação de acesso à fonte. O concept note "NIST AI RMF:
  Trustworthy Use of AI in Critical Infrastructure Profile" (abr/2026) ainda não define
  categorias de risco citáveis - é um documento de planejamento, não um perfil
  publicado - e por isso não está referenciado aqui; será avaliado quando (e se) um
  perfil completo for publicado. ISO/IEC 42001 permanece pendente por ser norma
  licenciada, sem acesso ao texto oficial.
