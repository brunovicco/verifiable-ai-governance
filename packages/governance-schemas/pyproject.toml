[project]
name = "governance-schemas"
version = "0.1.0"
description = "Shared contracts and taxonomies for Verifiable AI Governance"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11.0,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/governance_schemas"]
