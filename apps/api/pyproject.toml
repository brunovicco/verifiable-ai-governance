[project]
name = "ai-governance-api"
version = "0.1.0"
description = "FastAPI backend for Verifiable AI Governance"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.21.0,<1",
  "alembic>=1.16.0,<2",
  "asyncpg>=0.30.0,<1",
  "boto3>=1.39.0,<2",
  "fastapi>=0.141.1,<0.142",
  "governance-schemas",
  "httpx>=0.28.1,<0.29",
  "policy-engine",
  "pydantic-settings>=2.10.0,<3",
  "pyyaml>=6.0.2,<7",
  "python-multipart>=0.0.20,<1",
  "pyjwt[crypto]>=2.10.1,<3",
  "sqlalchemy[asyncio]>=2.0.40,<3",
  "uvicorn[standard]>=0.35.0,<1",
]

[tool.uv.sources]
governance-schemas = { workspace = true }
policy-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_governance_api"]
