name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: governance_test
          POSTGRES_USER: governance
          POSTGRES_PASSWORD: governance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U governance -d governance_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_DATABASE_URL: >-
        postgresql+asyncpg://governance:governance@127.0.0.1:5432/governance_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --locked
      - run: uv run ruff check .
      - run: uv run mypy apps/api/src packages/governance-schemas/src packages/policy-engine/src
      - run: uv run pytest

  fresh-install-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify migrations from an empty PostgreSQL database
        run: ./scripts/test_fresh_install_migrations.sh

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:web
      - run: npm run test:web
      - run: npm run build:web
