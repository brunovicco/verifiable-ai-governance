name: verifiable-ai-governance

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_governance}
      POSTGRES_USER: ${POSTGRES_USER:-governance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-governance-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - governance-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-governance}:${POSTGRES_PASSWORD:-governance-local-only}@postgres:5432/${POSTGRES_DB:-ai_governance}
      AUTO_CREATE_SCHEMA: "true"
      DEV_AUTH_ENABLED: "true"
      OIDC_ENABLED: "false"
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  governance-postgres:
